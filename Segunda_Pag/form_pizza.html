<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel = "stylesheet" href = "pizz.css">
  <title>Pedido Pizza</title>
</head>
<body>

  <h1 class = "titulos">Pedido pizza</h1>
  
  <div class = "form-div">
    <form id = "form-pedido" action = "recibo.html" method = "GET">

      <div class = "campo-nom">
          <span>Ingrese su nombre</span>
          <input type = "text" name ="usuario" id = "nombre" placeholder="ingrese su usario" required>
      </div>

      <div class = "campo-dir">
        <span>Ingrese su direccion: </span>
        <input type = "text" name = "direccion" id = "direccion" placeholder="ingrese su direccion" required>
      </div>

      <div class = "campo-tel">
        <span>Ingrese su numero de telefono:</span>
        <input type = "number" name = "telefono" id = "telefono" placeholder="Ingrese su numero de telefono">
      </div>

      <div class = "campo-pizza">
        <span>Seleccione el tipo de pizza que desea pedir</span>

        <img src = "pizza.png.png" alt = "pizza" class = "img-pizza">

        <div>
          <!-- Opción Napolitana -->
          <div class="opcion-pizza">
            <label class="nombre-pizza">
              <input type="checkbox" name="tipo-pizza-nap" id="check-nap" value="napolitana">
              <span>Napolitana</span>
            </label>

            <select name="tamano-pizza-nap" id="tamano-nap" class="select-tamano">
              <option value="" disabled selected>Tamaño</option>
              <option value="porcion">Porción</option>
              <option value="pequena">Pequeña (30 cm)</option>
              <option value="mediana">Mediana (36 cm)</option>
              <option value="grande">Grande (42 cm)</option>
              <option value="extra-grande">Extra Grande (46 cm)</option>
            </select>

            <input type="number" name="cantidad-pizza-nap" id="cant-nap" min="1" placeholder="Cant." class="input-cant">
          </div>
          
          <!-- Opción Jamón y Queso -->
          <div class="opcion-pizza">
            <label class="nombre-pizza">
              <input type="checkbox" name="tipo-pizza-jq" id="check-jq" value="jamon-queso">
              <span>Jamón y queso</span>
            </label>

            <select name="tamano-pizza-jq" id="tamano-jq" class="select-tamano">
              <option value="" disabled selected>Tamaño</option>
              <option value="porcion">Porción</option>
              <option value="pequena">Pequeña (30 cm)</option>
              <option value="mediana">Mediana (36 cm)</option>
              <option value="grande">Grande (42 cm)</option>
              <option value="extra-grande">Extra Grande (46 cm)</option>
            </select>

            <input type="number" name="cantidad-pizza-jq" id="cant-jq" min="1" placeholder="Cant." class="input-cant">
          </div>
          
          <!-- Opción Muzzarela -->
          <div class="opcion-pizza">
            <label class="nombre-pizza">
              <input type="checkbox" name="tipo-pizza-muz" id="check-muz" value="muzzarela">
              <span>Muzzarela</span>
            </label>

            <select name="tamano-pizza-muz" id="tamano-muz" class="select-tamano">
              <option value="" disabled selected>Tamaño</option>
              <option value="porcion">Porción</option>
              <option value="pequena">Pequeña (30 cm)</option>
              <option value="mediana">Mediana (36 cm)</option>
              <option value="grande">Grande (42 cm)</option>
              <option value="extra-grande">Extra Grande (46 cm)</option>
            </select>

            <input type="number" name="cantidad-pizza-muz" id="cant-muz" min="1" placeholder="Cant." class="input-cant">
          </div>
        </div>





        <div class = "botones">
          <a href = "recibo.html"></a><input type ="submit" name = "enviar" value = "Pedido">
          <input type = "reset" name = "cancelar" value = "Cancelar pedido">
        </div>


      </div>
      






 

    </form>
  </div>
  <script src = "formulario.js"></script>
</body>
</html>
